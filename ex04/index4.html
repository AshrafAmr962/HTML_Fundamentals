<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>

    <form action="#" method="get">

        <p>
            <label for="fullname">Full Name:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
                minlength="3">
        </p>

        <p>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8">
        </p>

        <p>Preferred Learning Method:</p>

        <p>
            <input
                type="radio"
                id="online"
                name="learning"
                value="online"
                required>
            <label for="online">Online</label>

            <input
                type="radio"
                id="classroom"
                name="learning"
                value="classroom">
            <label for="classroom">Classroom</label>
        </p>

        <p>
            <label for="language">
                Favorite Language:
            </label>

            <select id="language"
                    name="language"
                    required>
                <option value="">Select a language</option>
                <option value="c">C</option>
                <option value="cpp">C++</option>
                <option value="javascript">
                    JavaScript
                </option>
            </select>
        </p>

        <p>
            <label for="message">
                Tell us about yourself:
            </label>
        </p>

        <p>
            <textarea
                id="message"
                name="message"
                rows="5"
                cols="35"></textarea>
        </p>

        <p>
            <input
                type="checkbox"
                id="agreement"
                name="agreement"
                required>
            <label for="agreement">
                I agree to the terms and conditions
            </label>
        </p>

        <button type="submit">Register</button>

    </form>

</body>
</html>
